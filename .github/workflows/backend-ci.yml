name: Backend CI
on:
  pull_request:
  push:
    branches: [main, feature/backend-foundation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: starvega
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: starvega
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starvega"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://starvega:ci_only@localhost:5432/starvega?schema=public
      JWT_SECRET: ci-only-secret-not-for-production-123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Generate baseline SQL for disposable CI database
        run: |
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /tmp/starvega-baseline.sql
          npx prisma db execute --file /tmp/starvega-baseline.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/validation-constraints.sql --schema prisma/schema.prisma
      - run: npm test
      - run: node --test integration/database.test.js
