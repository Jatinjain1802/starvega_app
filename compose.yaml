services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: starvega
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: starvega
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U starvega -d starvega']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
